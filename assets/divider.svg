<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24" fill="none">
  <defs>
    <!-- Background Track Gradient -->
    <linearGradient id="baseTrack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="20%" stop-color="#0EA5E9" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#0EA5E9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <!-- Traveling Light Beam Gradient -->
    <linearGradient id="cometBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="35%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="90%" stop-color="#E0F2FE" stop-opacity="1" />
      <stop offset="95%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Center Orb Glow Filter -->
    <filter id="centerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes moveBeam {
      0% {
        transform: translateX(-350px);
      }
      50% {
        transform: translateX(1250px);
      }
      100% {
        transform: translateX(-350px);
      }
    }

    @keyframes pulseAura {
      0%, 100% {
        opacity: 0.45;
      }
      50% {
        opacity: 0.95;
      }
    }

    @keyframes pulseDiamond {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.75;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    .beam {
      animation: moveBeam 6s ease-in-out infinite;
    }

    .aura {
      animation: pulseAura 3s ease-in-out infinite;
    }

    .diamond {
      animation: pulseDiamond 2.5s ease-in-out infinite;
      transform-origin: 600px 12px;
    }
  </style>

  <!-- Ambient Glowing Line (Soft Background Glow) -->
  <line x1="50" y1="12" x2="1150" y2="12" stroke="url(#baseTrack)" stroke-width="4" filter="url(#neonGlow)" class="aura" stroke-linecap="round" />

  <!-- Crisp Core Track Line -->
  <line x1="50" y1="12" x2="1150" y2="12" stroke="url(#baseTrack)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Traveling Glowing Light Beam -->
  <g class="beam">
    <!-- Beam Glow Aura -->
    <rect x="0" y="8" width="280" height="8" rx="4" fill="url(#cometBeam)" filter="url(#neonGlow)" opacity="0.8" />
    <!-- Beam Core Line -->
    <line x1="0" y1="12" x2="280" y2="12" stroke="url(#cometBeam)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Bright Leading Photon Point -->
    <circle cx="265" cy="12" r="3" fill="#FFFFFF" filter="url(#neonGlow)" />
  </g>

  <!-- Center Decorative Tech Diamond -->
  <g class="diamond" filter="url(#centerGlow)">
    <polygon points="600,6 606,12 600,18 594,12" fill="#38BDF8" opacity="0.85" />
    <circle cx="600" cy="12" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
